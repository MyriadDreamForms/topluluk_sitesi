openapi: 3.0.3
info:
  title: Türkiye Teknoloji Topluluk Platformu API
  description: |
    Yazılımcılar, veri bilimciler ve teknoloji meraklıları için topluluk platformu REST API.
    
    ## Authentication
    API, JWT Bearer token kullanır. Access token 30 dakika, refresh token 7 gün geçerlidir.
    
    ## Rate Limiting
    - Genel: 100 request/dakika
    - İçerik oluşturma: 10 request/dakika
    - Auth: 5 request/dakika
    
    ## Pagination
    Tüm liste endpoint'leri `page` ve `pageSize` parametreleri alır.
    Varsayılan: page=1, pageSize=20, maksimum pageSize=100
  version: 1.0.0
  contact:
    name: API Support
    email: api@platform.dev
  
servers:
  - url: https://api.platform.dev/v1
    description: Production
  - url: http://localhost:5000/api/v1
    description: Development

tags:
  - name: Auth
    description: Kimlik doğrulama işlemleri
  - name: Users
    description: Kullanıcı profil işlemleri
  - name: Posts
    description: Blog yazısı işlemleri
  - name: Questions
    description: Soru-cevap işlemleri
  - name: Comments
    description: Yorum işlemleri
  - name: Tags
    description: Etiket işlemleri
  - name: Events
    description: Etkinlik işlemleri
  - name: Search
    description: Arama işlemleri
  - name: Admin
    description: Yönetim işlemleri (Admin/Moderator)

paths:
  # ==================== AUTH ====================
  /auth/register:
    post:
      tags: [Auth]
      summary: Yeni kullanıcı kaydı
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Kayıt başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: E-posta zaten kayıtlı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Kullanıcı girişi
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly refresh token cookie
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Access token yenileme
      operationId: refreshToken
      description: Refresh token HttpOnly cookie'den okunur
      responses:
        '200':
          description: Token yenilendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Çıkış yap
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Çıkış başarılı
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Şifre sıfırlama isteği
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: E-posta gönderildi (her durumda)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Şifre sıfırlama
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Şifre sıfırlandı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  # ==================== USERS ====================
  /users/me:
    get:
      tags: [Users]
      summary: Mevcut kullanıcı profili
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kullanıcı profili
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Users]
      summary: Profil güncelleme
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profil güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Avatar yükleme
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JPG/PNG, max 2MB
      responses:
        '200':
          description: Avatar yüklendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{username}:
    get:
      tags: [Users]
      summary: Kullanıcı profili görüntüleme
      operationId: getUserByUsername
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Kullanıcı profili
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfile'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{username}/posts:
    get:
      tags: [Users]
      summary: Kullanıcının postları
      operationId: getUserPosts
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Post listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostList'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{username}/questions:
    get:
      tags: [Users]
      summary: Kullanıcının soruları
      operationId: getUserQuestions
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Soru listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuestionList'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== POSTS ====================
  /posts:
    get:
      tags: [Posts]
      summary: Post listesi
      operationId: getPosts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, popular]
            default: recent
        - name: tag
          in: query
          schema:
            type: string
          description: Tag slug ile filtreleme
      responses:
        '200':
          description: Post listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostList'

    post:
      tags: [Posts]
      summary: Yeni post oluşturma
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Post detayı
      operationId: getPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post detayı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Posts]
      summary: Post güncelleme
      operationId: updatePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Post güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Posts]
      summary: Post silme
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Post silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{id}/comments:
    get:
      tags: [Posts, Comments]
      summary: Post yorumları
      operationId: getPostComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Yorum listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommentList'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Posts, Comments]
      summary: Post'a yorum ekleme
      operationId: addPostComment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Yorum eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== QUESTIONS ====================
  /questions:
    get:
      tags: [Questions]
      summary: Soru listesi
      operationId: getQuestions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, unanswered, popular]
            default: recent
        - name: tag
          in: query
          schema:
            type: string
          description: Tag slug ile filtreleme
      responses:
        '200':
          description: Soru listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuestionList'

    post:
      tags: [Questions]
      summary: Yeni soru oluşturma
      operationId: createQuestion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: Soru oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /questions/{id}:
    get:
      tags: [Questions]
      summary: Soru detayı
      operationId: getQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Soru detayı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Questions]
      summary: Soru güncelleme
      operationId: updateQuestion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionRequest'
      responses:
        '200':
          description: Soru güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Questions]
      summary: Soru silme
      operationId: deleteQuestion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Soru silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /questions/{id}/answers:
    get:
      tags: [Questions]
      summary: Soru cevapları
      operationId: getQuestionAnswers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Cevap listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnswerList'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Questions]
      summary: Cevap ekleme
      operationId: addAnswer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnswerRequest'
      responses:
        '201':
          description: Cevap eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /questions/{questionId}/answers/{answerId}/accept:
    post:
      tags: [Questions]
      summary: Cevabı kabul et
      operationId: acceptAnswer
      security:
        - bearerAuth: []
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: answerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cevap kabul edildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== ANSWERS ====================
  /answers/{id}:
    patch:
      tags: [Questions]
      summary: Cevap güncelleme
      operationId: updateAnswer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnswerRequest'
      responses:
        '200':
          description: Cevap güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Questions]
      summary: Cevap silme
      operationId: deleteAnswer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cevap silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /answers/{id}/comments:
    get:
      tags: [Questions, Comments]
      summary: Cevap yorumları
      operationId: getAnswerComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Yorum listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommentList'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Questions, Comments]
      summary: Cevaba yorum ekleme
      operationId: addAnswerComment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Yorum eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== COMMENTS ====================
  /comments/{id}:
    patch:
      tags: [Comments]
      summary: Yorum güncelleme
      operationId: updateComment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Yorum güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Comments]
      summary: Yorum silme
      operationId: deleteComment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yorum silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== TAGS ====================
  /tags:
    get:
      tags: [Tags]
      summary: Tag listesi
      operationId: getTags
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, popular]
            default: popular
        - name: q
          in: query
          schema:
            type: string
          description: Tag adında arama
      responses:
        '200':
          description: Tag listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTagList'

  /tags/{slug}:
    get:
      tags: [Tags]
      summary: Tag detayı
      operationId: getTag
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tag detayı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags/{slug}/content:
    get:
      tags: [Tags]
      summary: Tag'e ait içerikler
      operationId: getTagContent
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            type: string
            enum: [all, posts, questions]
            default: all
      responses:
        '200':
          description: İçerik listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagContentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== EVENTS ====================
  /events:
    get:
      tags: [Events]
      summary: Etkinlik listesi
      operationId: getEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filter
          in: query
          schema:
            type: string
            enum: [upcoming, past, all]
            default: upcoming
        - name: type
          in: query
          schema:
            type: string
            enum: [online, offline, all]
            default: all
      responses:
        '200':
          description: Etkinlik listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'

    post:
      tags: [Events]
      summary: Yeni etkinlik oluşturma
      operationId: createEvent
      security:
        - bearerAuth: []
      description: Sadece Admin ve Moderator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Etkinlik oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events/{id}:
    get:
      tags: [Events]
      summary: Etkinlik detayı
      operationId: getEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Etkinlik detayı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Events]
      summary: Etkinlik güncelleme
      operationId: updateEvent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Etkinlik güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Events]
      summary: Etkinlik silme
      operationId: deleteEvent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Etkinlik silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== SEARCH ====================
  /search:
    get:
      tags: [Search]
      summary: Genel arama
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Arama sorgusu (min 2 karakter)
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            type: string
            enum: [all, posts, questions]
            default: all
      responses:
        '200':
          description: Arama sonuçları
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  # ==================== FEED ====================
  /feed:
    get:
      tags: [Posts, Questions]
      summary: Ana sayfa feed
      operationId: getFeed
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            type: string
            enum: [recent, popular]
            default: recent
      responses:
        '200':
          description: Feed içerikleri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'

  # ==================== ADMIN ====================
  /admin/users:
    get:
      tags: [Admin]
      summary: Kullanıcı listesi (Admin)
      operationId: adminGetUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          schema:
            type: string
            enum: [all, admin, moderator, user]
            default: all
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, banned]
            default: all
        - name: q
          in: query
          schema:
            type: string
          description: Username veya email ile arama
      responses:
        '200':
          description: Kullanıcı listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{id}/role:
    patch:
      tags: [Admin]
      summary: Kullanıcı rolü değiştirme
      operationId: adminUpdateUserRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [user, moderator, admin]
      responses:
        '200':
          description: Rol güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/ban:
    post:
      tags: [Admin]
      summary: Kullanıcı banlama
      operationId: adminBanUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Kullanıcı banlandı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/unban:
    post:
      tags: [Admin]
      summary: Ban kaldırma
      operationId: adminUnbanUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ban kaldırıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/content/{type}/{id}/hide:
    post:
      tags: [Admin]
      summary: İçerik gizleme
      operationId: adminHideContent
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [post, question, answer, comment]
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: İçerik gizlendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/content/{type}/{id}/unhide:
    post:
      tags: [Admin]
      summary: İçerik gizlemeyi kaldırma
      operationId: adminUnhideContent
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [post, question, answer, comment]
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gizleme kaldırıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Sayfa numarası

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Sayfa başına öğe sayısı

  responses:
    ValidationError:
      description: Doğrulama hatası
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    Unauthorized:
      description: Kimlik doğrulama gerekli
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Yetki yetersiz
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Kaynak bulunamadı
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ===== Common =====
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Kaynak bulunamadı

    ValidationErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Doğrulama hatası
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    # ===== Auth =====
    RegisterRequest:
      type: object
      required: [email, password, username]
      properties:
        email:
          type: string
          format: email
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 128
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_]+$'
        displayName:
          type: string
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
            expiresIn:
              type: integer
              description: Token geçerlilik süresi (saniye)
            user:
              $ref: '#/components/schemas/UserProfile'

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    # ===== User =====
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        displayName:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
          format: uri
        githubUrl:
          type: string
        twitterUrl:
          type: string
        linkedInUrl:
          type: string
        websiteUrl:
          type: string
        role:
          type: string
          enum: [user, moderator, admin]
        createdAt:
          type: string
          format: date-time

    PublicUserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
          format: uri
        githubUrl:
          type: string
        twitterUrl:
          type: string
        linkedInUrl:
          type: string
        websiteUrl:
          type: string
        postCount:
          type: integer
        questionCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 500
        githubUrl:
          type: string
          maxLength: 200
        twitterUrl:
          type: string
          maxLength: 200
        linkedInUrl:
          type: string
          maxLength: 200
        websiteUrl:
          type: string
          maxLength: 200

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri

    # ===== Post =====
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          description: İçeriğin ilk 200 karakteri
        author:
          $ref: '#/components/schemas/UserSummary'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        viewCount:
          type: integer
        commentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          properties:
            content:
              type: string
              description: Markdown içerik
            contentHtml:
              type: string
              description: Render edilmiş HTML

    CreatePostRequest:
      type: object
      required: [title, content, tags]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 50000
        tags:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 5

    UpdatePostRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 50000
        tags:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 5

    PaginatedPostList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ===== Question =====
    Question:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        author:
          $ref: '#/components/schemas/UserSummary'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagSummary'
        viewCount:
          type: integer
        answerCount:
          type: integer
        hasAcceptedAnswer:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    QuestionDetail:
      allOf:
        - $ref: '#/components/schemas/Question'
        - type: object
          properties:
            body:
              type: string
            bodyHtml:
              type: string
            acceptedAnswerId:
              type: string
              format: uuid

    CreateQuestionRequest:
      type: object
      required: [title, body, tags]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 30000
        tags:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 5

    UpdateQuestionRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 30000
        tags:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 5

    PaginatedQuestionList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ===== Answer =====
    Answer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        bodyHtml:
          type: string
        author:
          $ref: '#/components/schemas/UserSummary'
        isAccepted:
          type: boolean
        commentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAnswerRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 30000

    UpdateAnswerRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 30000

    PaginatedAnswerList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ===== Comment =====
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        author:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000

    UpdateCommentRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000

    PaginatedCommentList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ===== Tag =====
    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        postCount:
          type: integer
        questionCount:
          type: integer

    TagSummary:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string

    PaginatedTagList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TagContentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            tag:
              $ref: '#/components/schemas/Tag'
            posts:
              type: array
              items:
                $ref: '#/components/schemas/Post'
            questions:
              type: array
              items:
                $ref: '#/components/schemas/Question'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ===== Event =====
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        eventType:
          type: string
          enum: [online, offline]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        imageUrl:
          type: string
          format: uri
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            description:
              type: string
            descriptionHtml:
              type: string
            location:
              type: string
            onlineUrl:
              type: string
              format: uri

    CreateEventRequest:
      type: object
      required: [title, description, eventType, startDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        eventType:
          type: string
          enum: [online, offline]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 500
          description: Offline etkinlikler için zorunlu
        onlineUrl:
          type: string
          maxLength: 500
          description: Online etkinlikler için zorunlu
        imageUrl:
          type: string
          format: uri

    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        eventType:
          type: string
          enum: [online, offline]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 500
        onlineUrl:
          type: string
          maxLength: 500
        imageUrl:
          type: string
          format: uri

    PaginatedEventList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ===== Search =====
    SearchResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            posts:
              type: array
              items:
                $ref: '#/components/schemas/Post'
            questions:
              type: array
              items:
                $ref: '#/components/schemas/Question'
            totalPosts:
              type: integer
            totalQuestions:
              type: integer
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ===== Feed =====
    FeedItem:
      type: object
      properties:
        type:
          type: string
          enum: [post, question]
        post:
          $ref: '#/components/schemas/Post'
        question:
          $ref: '#/components/schemas/Question'

    FeedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ===== Admin =====
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [user, moderator, admin]
        isBanned:
          type: boolean
        banReason:
          type: string
        bannedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        postCount:
